{% extends "base.html" %}

{% block title %}{{ post.title }} | {{ block.super }}{% endblock %}

{% block content %}
<article class="blog-detail">
    <h1>{{ post.title }}</h1>

    <p>{{ post.published_at|date:"F d, Y" }}</p>

    <p>{{ post.excerpt }}</p>

    {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" alt="{{ post.title }}">
    {% endif %}

    <div class="article-content">
        {{ post.content|linebreaks }}
    </div>

    <a href="{% url 'blog:list' %}">← Back to Blog</a>
</article>
{% endblock %}
